# Universal CI pipeline for the entire Monster Tamers project:
#   - unit:       pytest suites for every Python service and the API Gateway
#   - component:  Bruno component suites for Encounter, Player, and Monster services
#   - integration: full root backend stack + standalone non-root frontend E2E check
#   - security:   Bandit (SAST) + pip-audit (dependency vulnerabilities)
#   - images:     Trivy image vulnerability scan + Dockerfile config scan
#   - secrets:    Trivy repository secret scan
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [encounter_service, monster_service, player_service, gateway]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q

  component-encounter:
    name: Component tests (encounter)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      - name: Make throwaway secrets for this run
        run: |
          grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | while read -r name; do
            echo "$name=$(openssl rand -hex 16)"
          done > .env

      - name: Start Encounter component stack
        run: docker compose -f compose.encounter.yaml up --build -d --wait

      - name: Trust our certificate authority
        run: docker compose -f compose.encounter.yaml cp encounter-service:/certs/ca.pem tests/bruno/ca.pem

      - name: Run Encounter Bruno tests
        working-directory: tests/bruno
        run: bru run encounter encounter-stub encounter-security --env encounter-component --cacert ca.pem

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.encounter.yaml logs

      - name: Stop Encounter component stack
        if: always()
        run: docker compose -f compose.encounter.yaml down -v

  component-player:
    name: Component tests (player)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      - name: Make throwaway secrets for this run
        run: |
          grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | while read -r name; do
            echo "$name=$(openssl rand -hex 16)"
          done > .env

      - name: Start Player component stack
        run: docker compose -f compose.player.yaml up --build -d --wait

      - name: Trust our certificate authority
        run: docker compose -f compose.player.yaml cp player-service:/certs/ca.pem tests_player/bruno/ca.pem

      - name: Run Player Bruno tests
        working-directory: tests_player/bruno
        run: bru run health account login --cacert ca.pem

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.player.yaml logs

      - name: Stop Player component stack
        if: always()
        run: docker compose -f compose.player.yaml down -v

  component-monster:
    name: Component tests (monster)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyJWT for test token generation
        run: pip install PyJWT==2.15.0 cryptography==50.0.0

      - name: Generate CI Secrets and Certificates
        run: |
          mkdir -p monster_service/certs
          echo "postgres" > monster_service/certs/db_password.txt
          echo "U3VwZXJTZWNyZXRGZXJuZXRLZXlGb3JDSVRlc3RzISE=" > monster_service/certs/data_key.txt
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout monster_service/certs/server.key -out monster_service/certs/server.pem -subj "/CN=localhost"
          cp monster_service/certs/server.pem monster_service/certs/ca.pem
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout monster_service/certs/db_server.key -out monster_service/certs/db_server.pem -subj "/CN=monster_db" -addext "subjectAltName=DNS:monster_db"
          openssl genpkey -algorithm RSA -out /tmp/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in /tmp/jwt_private.pem -out monster_service/certs/jwt_public.pem
          chmod a+r monster_service/certs/*

      - name: Start Monster standalone stack
        run: INTERNAL_SERVICE_SECRET=test-internal-secret-key docker compose -f monster_service/docker-compose.yaml up --build -d --wait

      - name: Run Monster Bruno tests
        working-directory: monster_service/tests/bruno
        run: |
          if [ ! -f bruno.json ]; then
            echo '{"version": "1", "name": "monster_service_tests", "type": "collection"}' > bruno.json
          fi
          mkdir -p environments
          python3 -c "import jwt, time; key=open('/tmp/jwt_private.pem').read(); now=int(time.time()); valid=jwt.encode({'iss':'player-service','sub':'test_player_01','aud':'monster-tamers','username':'test','exp':now+3600},key,algorithm='RS256'); exp=jwt.encode({'iss':'player-service','sub':'test_player_01','aud':'monster-tamers','username':'test','exp':now-3600},key,algorithm='RS256'); open('environments/local-component.bru','w').write(f'vars {{\n  monsterUrl: https://localhost:5002\n  internalSecret: test-internal-secret-key\n  testToken: {valid}\n  expiredToken: {exp}\n}}\n')"
          bru run --env local-component --cacert ../../certs/ca.pem

      - name: Show logs on failure
        if: failure()
        run: docker compose -f monster_service/docker-compose.yaml logs

      - name: Stop Monster standalone stack
        if: always()
        env:
          INTERNAL_SERVICE_SECRET: test-internal-secret-key
        run: docker compose -f monster_service/docker-compose.yaml down -v

  integration:
    name: Full-stack integration (Gateway + Standalone Frontend)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests==2.33.0

      - name: Make throwaway secrets for this run
        run: |
          grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | while read -r name; do
            echo "$name=$(openssl rand -hex 16)"
          done > .env

      - name: Start full backend stack and standalone frontend
        run: |
          docker compose up --build -d --wait
          docker build -t monster-tamer-frontend ./frontend_service
          docker run -d --name monster-tamer-frontend -p 127.0.0.1:8080:8080 monster-tamer-frontend

      - name: Verify all containers run as non-root
        run: |
          for c in $(docker compose ps -q) $(docker ps -q --filter "name=monster-tamer-frontend"); do
            uid=$(docker exec "$c" id -u)
            echo "container=$c uid=$uid"
            test "$uid" != "0"
          done

      - name: Verify end-to-end gameplay flow through Gateway
        run: |
          docker compose cp gateway:/certs/ca.pem /tmp/mt_ca.pem
          python3 - <<'PY'
          import uuid, requests

          ca = "/tmp/mt_ca.pem"
          gw = "https://localhost:5005"
          uname = "ci_" + uuid.uuid4().hex[:8]
          pw = "SecurePass123!"

          assert requests.get(f"{gw}/health", verify=ca, timeout=5).status_code == 200
          fe = requests.get("http://localhost:8080/", timeout=5)
          assert fe.status_code == 200 and "Monster Tamer" in fe.text

          assert requests.get(f"{gw}/internal/players/x/monsters", verify=ca, timeout=5).status_code == 404
          assert requests.post(f"{gw}/internal/rewards", json={}, verify=ca, timeout=5).status_code == 404

          assert requests.post(f"{gw}/account", json={"username": uname, "password": pw}, verify=ca, timeout=5).status_code == 201
          tok = requests.post(f"{gw}/login", json={"username": uname, "password": pw}, verify=ca, timeout=5).json()["token"]
          hdrs = {"Authorization": f"Bearer {tok}"}

          cat = requests.get(f"{gw}/monsters", verify=ca, timeout=5)
          assert cat.status_code == 200 and len(cat.json()) == 16
          img = requests.get(f"{gw}" + cat.json()[0]["image_url"], verify=ca, timeout=5)
          assert img.status_code == 200 and img.headers["Content-Type"] == "image/jpeg"

          col = requests.get(f"{gw}/collection", headers=hdrs, verify=ca, timeout=5).json()["collection"]
          ids = [str(m["ownership_id"]) for m in col]
          assert requests.put(f"{gw}/team", json={"monster_ids": ids}, headers=hdrs, verify=ca, timeout=5).status_code == 200

          eid = requests.post(f"{gw}/encounters", json={"challenge_id": 15}, headers=hdrs, verify=ca, timeout=5).json()["id"]
          act = requests.post(f"{gw}/encounters/{eid}/action", json={"action": "attack"}, headers=hdrs, verify=ca, timeout=5)
          assert act.status_code == 200 and act.json()["status"] == "closed"
          assert requests.get(f"{gw}/encounters", headers=hdrs, verify=ca, timeout=5).json()["encounters"][0]["id"] == eid
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack and standalone frontend
        if: always()
        run: |
          docker rm -f monster-tamer-frontend || true
          docker compose down -v

  security:
    name: Code and libraries (${{ matrix.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [encounter_service, player_service, monster_service, gateway, tls_init, monster_stub]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit and pip-audit
        run: pip install bandit==1.8.3 pip-audit==2.9.0

      - name: Bandit (a medium or high finding fails the job)
        run: bandit -r ${{ matrix.folder }} -x ./${{ matrix.folder }}/tests --severity-level medium

      - name: pip-audit (a library with a known vulnerability fails the job)
        run: |
          for file in ${{ matrix.folder }}/requirements*.txt; do
            pip-audit -r "$file"
          done

  images:
    name: Image (${{ matrix.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        folder:
          - encounter_service
          - encounter_service/db
          - player_service
          - player_service/db
          - monster_service
          - monster_service/db
          - gateway
          - frontend_service
          - tls_init
          - monster_stub
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image on the newest base image
        run: docker build --pull -t ci-image ./${{ matrix.folder }}

      - name: Vulnerabilities in the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1

      - name: Misconfigurations in the Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.folder }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.76.1

  secrets:
    name: Committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          secret-config: trivy-secret.yaml
          exit-code: "1"
          version: v0.76.1
