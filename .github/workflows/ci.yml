# Runs the tests of every service at each push and pull request (Lab 7).
# A failing test turns the run red. To add a service, add its name to the matrix:
#   unit:       a folder with requirements-dev.txt and its pytest tests
#   component:  compose.<name>.yaml, a compose service <name>-service, and the Bruno
#               folders <name>, <name>-stub and <name>-security (hostile input, Lab 8)
#               with the environment <name>-component
#   security:   a folder with Python code and its requirements*.txt (Lab 9)
#   images:     a folder with a Dockerfile (Lab 9)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read  # the jobs only read the code

jobs:
  unit:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false  # a failure in one service does not hide the others
      matrix:
        service: [encounter_service]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest

  component:
    name: Component tests (${{ matrix.service }})
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [encounter]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      # Every value in .env.example gets a new random value, used only by this run.
      - name: Make throwaway secrets for this run
        run: |
          grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | while read -r name; do
            echo "$name=$(openssl rand -hex 16)"
          done > .env

      - name: Start the service with its database and stubs
        run: docker compose -f compose.${{ matrix.service }}.yaml up --build -d --wait

      # The services use HTTPS with our development authority, made at start-up.
      - name: Trust our certificate authority
        run: docker compose -f compose.${{ matrix.service }}.yaml cp ${{ matrix.service }}-service:/certs/ca.pem tests/bruno/ca.pem

      - name: Component tests
        working-directory: tests/bruno
        run: bru run ${{ matrix.service }} ${{ matrix.service }}-stub ${{ matrix.service }}-security --env ${{ matrix.service }}-component --cacert ca.pem

      - name: Show the logs
        if: failure()
        run: docker compose -f compose.${{ matrix.service }}.yaml logs

      - name: Stop the service
        if: always()
        run: docker compose -f compose.${{ matrix.service }}.yaml down -v

  # Lab 9: our code (Bandit) and the libraries we use (pip-audit).
  security:
    name: Code and libraries (${{ matrix.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [encounter_service, tls_init, monster_stub, player_stub]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit and pip-audit
        run: pip install bandit==1.8.3 pip-audit==2.9.0

      - name: Bandit (a medium or high finding fails the job)
        run: bandit -r ${{ matrix.folder }} -x ./${{ matrix.folder }}/tests --severity-level medium

      - name: pip-audit (a library with a known vulnerability fails the job)
        run: |
          for file in ${{ matrix.folder }}/requirements*.txt; do
            pip-audit -r "$file"
          done

  # Lab 9: the images we ship have no critical or high vulnerability that already has a fix.
  images:
    name: Image (${{ matrix.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        folder: [encounter_service, encounter_service/db, tls_init, monster_stub, player_stub]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image on the newest base image
        run: docker build --pull -t ci-image ./${{ matrix.folder }}

      - name: Vulnerabilities in the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1

      - name: Misconfigurations in the Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.folder }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.76.1

  # Lab 9: no key, token or password committed anywhere in the repository.
  secrets:
    name: Committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          version: v0.76.1
