name: CI Monster Service

on:
  push:
  pull_request:

jobs:
  component-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node for Bruno
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      - name: Generate CI Secrets and Certificates
        run: |
          mkdir -p monster_service/certs
          echo "postgres" > monster_service/certs/db_password.txt
          echo "U3VwZXJTZWNyZXRGZXJuZXRLZXlGb3JDSVRlc3RzISE=" > monster_service/certs/data_key.txt
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout monster_service/certs/server.key -out monster_service/certs/server.pem -subj "/CN=localhost"
          cp monster_service/certs/server.pem monster_service/certs/ca.pem
          chmod a+r monster_service/certs/*

      - name: Start monster_service database and API
        run: docker compose -f monster_service/docker-compose.yaml up --build -d --wait

      - name: Run Component Tests with Bruno
        working-directory: monster_service/tests/bruno
        run: |
          if [ ! -f bruno.json ]; then
            echo '{"version": "1", "name": "monster_service_tests", "type": "collection"}' > bruno.json
          fi
          bru run --env local-component --insecure
      - name: Show logs if failure
        if: failure()
        run: docker compose -f monster_service/docker-compose.yaml logs

      - name: Stop stack
        if: always()
        run: docker compose -f monster_service/docker-compose.yaml down -v
  
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Run Bandit (Static Code Analysis)
        run: bandit -r monster_service/app -x ./monster_service/tests --severity-level medium
      - name: Run pip-audit (Dependency Audit)
        run: pip-audit -r monster_service/requirements.txt

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t monster-service:ci ./monster_service
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'monster-service:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: './monster_service'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'secret'
          scan-ref: './monster_service'
          exit-code: '1'