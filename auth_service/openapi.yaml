openapi: 3.1.0

info:
  title: ASE Project - Monster Tamer
  version: 1.0.0
  description: >-
    API per la gestione delle operazioni, la creazione di account, il login e
    l'accesso al gioco.

servers:
  - url: http://localhost:5001

paths:
  /auth_service:
    post:
      summary: Perform authentication and game-related operations
      description: >-
        This endpoint handles multiple operations such as creating an account,
        logging in, entering the game, and managing progress or characters.
      operationId: authService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_type:
                  type: string
                  enum:
                    - create_account
                    - login
                    - enter_game
                    - game_progress
                    - characters
                  description: >-
                    The type of operation to perform. Supported operations are:
                    - `create_account`: Create a new user account.
                    - `login`: Log in to an existing account.
                    - `enter_game`: Enter the game after logging in.
                    - `game_progress`: Retrieve or update game progress.
                    - `characters`: Manage game characters.
                arguments:
                  type: array
                  items:
                    type: string
                  description: >-
                    Arguments required for the operation. The number and type of
                    arguments depend on the operation:
                    - `create_account`: [username, password]
                    - `login`: [username, password]
                    - `enter_game`: [username]
                    - `game_progress`: [username]
                    - `characters`: [username]
              required:
                - operation_type
                - arguments
            examples:
              create_account:
                value:
                  operation_type: create_account
                  arguments: ["new_user", "new_password"]
              login:
                value:
                  operation_type: login
                  arguments: ["test_user", "test_password"]
              enter_game:
                value:
                  operation_type: enter_game
                  arguments: ["test_user"]
              game_progress:
                value:
                  operation_type: game_progress
                  arguments: ["test_user"]
              characters:
                value:
                  operation_type: characters
                  arguments: ["test_user"]
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
                  progress:
                    type: object
                    properties:
                      level:
                        type: integer
                      experience:
                        type: integer
                  characters:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                        level:
                          type: integer
              examples:
                login_success:
                  value:
                    message: Login successful
                    username: test_user
                enter_game_success:
                  value:
                    message: Welcome to the game!
                    username: test_user
                    progress:
                      level: 1
                      experience: 0
                    characters:
                      - name: FireDragon
                        type: fire
                        level: 1
                      - name: WaterPhoenix
                        type: water
                        level: 1
                      - name: EarthGolem
                        type: earth
                        level: 1
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
              example:
                message: Account created successfully
                username: new_user
        '400':
          description: Invalid input or request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              examples:
                invalid_input:
                  value:
                    error: invalid_input
                    message: Username and password must be strings
                invalid_request:
                  value:
                    error: invalid_request
                    message: Request body must be a JSON object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: unauthorized
                message: Invalid username or password
        '409':
          description: Conflict (e.g., user already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: user_exists
                message: Username already exists
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: server_error
                message: An unexpected error occurred