# Component tests of the Player Service: the real service with its PostgreSQL TLS
# database, published only on this computer for Bruno (tests_player/bruno).
name: player-component

include:
  - tls_init/compose.yaml

x-certificate-group: &certificate-group
  group_add: ["10000"]

services:
  player-db:
    extends:
      file: player_service/compose.yaml
      service: player-db

  player-service:
    extends:
      file: player_service/compose.yaml
      service: player-service
    container_name: player-service
    ports:
      - "127.0.0.1:5001:5001"

volumes:
  player-db-data:
