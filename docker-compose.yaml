services:
  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      AUTH_URL: http://auth_service:5001
    depends_on:
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth_service:
    build: ./auth_service
    container_name: auth_service
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  shared-data: