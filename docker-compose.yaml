include:
  - tls_init/compose.yaml
  - encounter_service/compose.yaml
services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      AUTH_URL: https://player-service:5001
      ENCOUNTER_URL: https://encounter-service:5003
    depends_on:
      player-service:
        condition: service_healthy
      encounter-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://localhost:5005/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  player-service:
    build: ./player_service
    container_name: player-service
    environment:
      DATABASE_URL: sqlite:////data/player_db.sqlite3
    volumes:
      - player-service-certs:/certs:ro
      - player-db-data:/data
    group_add:
      - "10000"
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5001/health', context=ssl.create_default_context(cafile='/certs/ca.pem'), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    encounter-service:
    build: ./encounter_service
    container_name: encounter-service
    group_add:
      - "10000"
    environment:
      ENCOUNTER_URL: https://encounter-service:5003
      POSTGRES_DB: encounter_db
      POSTGRES_USER: encounter_app
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_HOST: encounter-db
    volumes:
      - encounter-service-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      encounter-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5003/health', context=ssl.create_default_context(cafile='/certs/ca.pem'), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  encounter-db:
    image: postgres:15
    container_name: encounter-db
    environment:
      POSTGRES_DB: encounter_db
      POSTGRES_USER: encounter_app
      POSTGRES_PASSWORD: your_password_here
      ENCOUNTER_DB_PASSWORD: your_password_here
    volumes:
      - encounter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  player-db-data:
  encounter-db-data: