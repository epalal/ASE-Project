services:
  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      AUTH_URL: http://auth:5001
      GAME_URL: http://game:5002
    depends_on:
      auth:
        condition: service_healthy
      game:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth:
    build: ./auth_service
    container_name: auth_service
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  game:
    build: ./game_service
    container_name: game_service
    volumes:
      - ./data:/app/data
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  monster:
    build: ./monster_service
    container_name: monster_service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@monster_db:5432/monster_db
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-test-internal-secret-key}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
    depends_on:
      monster_db:
        condition: service_healthy
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://localhost:5002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  monster_db:
    image: postgres:15-alpine
    container_name: monster_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=monster_db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shared-data: