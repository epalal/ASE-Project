services:
  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      AUTH_URL: http://player-service:5001
      MONSTER_URL: https://monster-service:5002
      ENCOUNTER_URL: https://encounter-service:5003
    depends_on:
      auth:
        condition: service_healthy
      game:
        condition: service_healthy
      monster:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s