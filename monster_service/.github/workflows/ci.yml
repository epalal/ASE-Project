name: CI Monster Service
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node for Bruno
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      - name: Start monster_service database and API
        # Start the monster_service stack in detached mode and wait for it to be ready
        run: docker compose -f monster_service/docker-compose.yaml up --build -d --wait

      - name: Run Component Tests with Bruno
        working-directory: monster_service/tests/bruno
        # Execute the Bruno CLI to run the component tests for the monster_service, using the local-component environment
        run: bru run monsters --env local-component

      - name: Show logs if failure
        if: failure()
        run: docker compose -f monster_service/docker-compose.yaml logs

      - name: Stop stack
        if: always()
        run: docker compose -f monster_service/docker-compose.yaml down