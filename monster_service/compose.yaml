services:
  monster-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: monster_admin
      POSTGRES_PASSWORD: ${MONSTER_DB_ADMIN_PASSWORD:?set it in .env}
      POSTGRES_DB: monster_db
    volumes:
      - monster-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monster_admin -d monster_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  monster-service:
    build: .
    group_add: ["10000"]
    environment:
      DATABASE_URL: postgresql://monster_admin:${MONSTER_DB_ADMIN_PASSWORD}@monster-db:5432/monster_db
      JWT_PUBLIC_KEY_PATH: /certs/jwt_public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set it in .env}
    volumes:
      - monster-service-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      monster-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5002/health', context=ssl.create_default_context(cafile='/certs/ca.pem'), timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  monster-db-data:
