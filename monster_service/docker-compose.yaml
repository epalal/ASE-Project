services:
  monster_service:
    build: .
    ports:
      - "5002:5002"
    volumes:
      - ./certs:/certs:ro
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@monster_db:5432/monster_db
      - INTERNAL_SERVICE_SECRET=test-internal-secret-key
      - JWT_PUBLIC_KEY=-----BEGIN PUBLIC KEY----- 
       eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0X3BsYXllcl8wMSJ9.r6ZDl-ti4t_7jbuLmnA7WX8OO6UWtC7rJPEIq_D2Hoojk02s2FqS1EGa7j54eamknYmibR4OaXP7QfKtNLzMdNIUXGeE0nawuglKikPdaine8nzsYwZXBL3H96BwyxR31lWYQVpdViqgAiF8K_saAJvS7jYoQl4d_YV2rAfX1B0-57iCOjno8J2I9GC5-Z2L8EOPFmpkG-mXQvgVW5U8Pkrx8lpKvnvxW5Y-6DvSalr3BBkDykctDZwVYN0jyFv7jKvZHJpxw8bk6keTEqZVn6LBdyq9l9gddyB8j62zxweo4SS7DTl_UW-NPMy6NMQ3j-QrGZW45B1z9QoFvdmFNg 
       -----END PUBLIC KEY-----
