name: ase-monster-test

services:
  monster_service:
    build: .
    ports:
      - "5002:5002"
    volumes:
      - ./certs:/certs:ro
    environment:
      DATABASE_URL: postgresql://postgres@monster_db:5432/monster_db
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-test-internal-secret-key}
      JWT_PUBLIC_KEY_PATH: /certs/jwt_public.pem
    depends_on:
      monster_db:
        condition: service_healthy
    secrets:
      - ca
      - source: monster_cert
        target: cert
      - source: monster_key
        target: key
      - db_password
      - data_key
      - jwt_public

  monster_db:
    image: postgres:15-alpine
    container_name: monster_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=monster_db
    secrets:
      - db_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  ca:
    file: ./certs/ca.pem
  monster_cert:
    file: ./certs/server.pem
  monster_key:
    file: ./certs/server.key
  db_password:
    file: ./certs/db_password.txt
  data_key:
    file: ./certs/data_key.txt
  jwt_public:
    file: ./certs/jwt_public.pem