name: ase-monster-test

services:
  monster_service:
    build: .
    ports:
      - "5002:5002"
    volumes:
      - ./certs:/certs:ro
    environment:
      DATABASE_URL: postgresql://postgres@monster_db:5432/monster_db
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-test-internal-secret-key}
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7WP5uNd8DYvSrdDypUYy
        0Gp3L1LrjXE5r8JMo6shIo/oklWgepVRJKFpOEIMrwj7LLM+Xonjmw0rxH4afVU9
        am9RQpWg59XksKaITOdld+zc67kMkov7Tx6z3yvImrWekML29BHrgpbQvi2pMRWU
        OJIrSRHQTTXiwNDXNxYBZk/phggpRsMFxxUBXEcCp9Id4Cx/0ADeIvCtCL/CyeVV
        CAvc/Rdc4DEk2swJ8s+T35IsMbQ40VM59mQSyByCulTxVNXHgUgKxRtqbZVdGKPr
        +15wyjuzBb3WClBZXJoseQIQFcNtbTotu8Cj7bSXblov4Y1jSIVZfVKNpTTTIhQu
        awIDAQAB
        -----END PUBLIC KEY-----
    depends_on:
      monster_db:
        condition: service_healthy
    secrets:
      - ca
      - source: monster_cert
        target: cert
      - source: monster_key
        target: key
      - db_password
      - data_key

  monster_db:
    image: postgres:15-alpine
    container_name: monster_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=monster_db
    secrets:
      - db_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  ca:
    file: ./certs/ca.pem
  monster_cert:
    file: ./certs/server.pem
  monster_key:
    file: ./certs/server.key
  db_password:
    file: ./certs/db_password.txt
  data_key:
    file: ./certs/data_key.txt