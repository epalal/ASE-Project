name: ase-monster-test

services:
  monster_service:
    build: .
    ports:
      - "127.0.0.1:5002:5002"
    volumes:
      - ./certs:/certs:ro
    environment:
      DATABASE_URL: postgresql://postgres@monster_db:5432/monster_db?sslmode=verify-full&sslrootcert=/certs/db_server.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set it before starting the service}
      JWT_PUBLIC_KEY_PATH: /certs/jwt_public.pem
      DATA_KEY_PATH: /run/secrets/data_key
    depends_on:
      monster_db:
        condition: service_healthy
    secrets:
      - ca
      - source: monster_cert
        target: cert
      - source: monster_key
        target: key
      - db_password
      - data_key
      - jwt_public

  monster_db:
    build: ./db
    container_name: monster_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=monster_db
      - POSTGRES_SSL_CERT_FILE=/run/secrets/monster_db_cert
      - POSTGRES_SSL_KEY_FILE=/run/secrets/monster_db_key
    secrets:
      - db_password
      - source: monster_db_cert
        target: monster_db_cert
      - source: monster_db_key
        target: monster_db_key
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  ca:
    file: ./certs/ca.pem
  monster_cert:
    file: ./certs/server.pem
  monster_key:
    file: ./certs/server.key
  db_password:
    file: ./certs/db_password.txt
  data_key:
    file: ./certs/data_key.txt
  jwt_public:
    file: ./certs/jwt_public.pem
  monster_db_cert:
    file: ./certs/db_server.pem
  monster_db_key:
    file: ./certs/db_server.key