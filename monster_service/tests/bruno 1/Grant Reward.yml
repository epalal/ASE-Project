info:
  name: Grant Reward
  type: http
  seq: 3

http:
  method: POST
  url: "{{monsterUrl}}/internal/rewards"
  headers:
    - name: X-Internal-Secret
      value: "{{internalSecret}}"
  body:
    type: json
    data: |-
      {
        "player_id": "test_player_01",
        "monster_id": 11,
        "encounter_id": "enc_999"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
