info:
  name: body bigger than 10 KB
  type: http
  seq: 2

http:
  method: PUT
  url: "{{encounterUrl}}/team"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: text
    data: |-
      {"monster_ids": [""]}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "413"
    - expression: res.body.error
      operator: eq
      value: "request_entity_too_large"

settings:
  encodeUrl: true
