info:
  name: challenge id 1e999
  type: http
  seq: 6

http:
  method: POST
  url: "{{encounterUrl}}/encounters"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: text
    data: |-
      {"challenge_id": 1e999}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "invalid_input"

settings:
  encodeUrl: true
