info:
  name: expired token
  type: http
  seq: 15

http:
  method: GET
  url: "{{encounterUrl}}/team"
  auth:
    type: bearer
    token: "{{expiredToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.error
      operator: eq
      value: "unauthorized"
    - expression: res.headers["www-authenticate"]
      operator: contains
      value: "invalid_token"

settings:
  encodeUrl: true
