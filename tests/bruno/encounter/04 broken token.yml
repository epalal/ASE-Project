info:
  name: broken token
  type: http
  seq: 4

http:
  method: GET
  url: "{{encounterUrl}}/team"
  auth:
    type: bearer
    token: "not-a-real-token"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.error
      operator: eq
      value: "unauthorized"

settings:
  encodeUrl: true
