info:
  name: save team - body is not a list
  type: http
  seq: 5

http:
  method: PUT
  url: "{{encounterUrl}}/team"
  body:
    type: json
    data: |-
      {"monster_ids": "101"}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "invalid_input"

settings:
  encodeUrl: true
