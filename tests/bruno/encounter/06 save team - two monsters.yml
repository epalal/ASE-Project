info:
  name: save team - two monsters
  type: http
  seq: 6

http:
  method: PUT
  url: "{{encounterUrl}}/team"
  body:
    type: json
    data: |-
      {"monster_ids": ["101", "105"]}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "team_size"

settings:
  encodeUrl: true
