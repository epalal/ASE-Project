info:
  name: read the team
  type: http
  seq: 10

http:
  method: GET
  url: "{{encounterUrl}}/team"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.monster_ids[2]
      operator: eq
      value: "\"109\""

settings:
  encodeUrl: true
