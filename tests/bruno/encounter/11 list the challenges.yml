info:
  name: list the challenges
  type: http
  seq: 11

http:
  method: GET
  url: "{{encounterUrl}}/challenges"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.challenges
      operator: length
      value: "16"
    - expression: res.body.challenges[11].name
      operator: eq
      value: "Wild Ashwing"

settings:
  encodeUrl: true
