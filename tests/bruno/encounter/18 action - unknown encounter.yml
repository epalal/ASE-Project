info:
  name: action - unknown encounter
  type: http
  seq: 18

http:
  method: POST
  url: "{{encounterUrl}}/encounters/no-such-encounter/action"
  body:
    type: json
    data: |-
      {"action": "escape"}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: "encounter_not_found"

settings:
  encodeUrl: true
