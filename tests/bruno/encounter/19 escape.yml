info:
  name: escape
  type: http
  seq: 19

http:
  method: POST
  url: "{{encounterUrl}}/encounters/{{encounterId}}/action"
  body:
    type: json
    data: |-
      {"action": "escape"}
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: "closed"
    - expression: res.body.result
      operator: eq
      value: "escaped"
    - expression: res.body.roll
      operator: isNull
    - expression: res.body.reward_status
      operator: eq
      value: "none"

settings:
  encodeUrl: true
