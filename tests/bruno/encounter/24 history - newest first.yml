info:
  name: history - newest first
  type: http
  seq: 24

http:
  method: GET
  url: "{{encounterUrl}}/encounters"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.encounters[0].id
      operator: eq
      value: "{{ownedEncounterId}}"
    - expression: res.body.encounters[1].id
      operator: eq
      value: "{{encounterId}}"
    - expression: res.body.encounters[0].closed_at
      operator: isString

settings:
  encodeUrl: true
