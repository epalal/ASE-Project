info:
  name: one encounter
  type: http
  seq: 25

http:
  method: GET
  url: "{{encounterUrl}}/encounters/{{encounterId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{encounterId}}"
    - expression: res.body.result
      operator: eq
      value: "escaped"
    - expression: res.body.created_at
      operator: isString

settings:
  encodeUrl: true
