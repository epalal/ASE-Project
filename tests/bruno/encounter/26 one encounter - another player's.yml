info:
  name: one encounter - another player's
  type: http
  seq: 26

http:
  method: GET
  url: "{{encounterUrl}}/encounters/{{encounterId}}"
  auth:
    type: bearer
    token: "{{tokenB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: "encounter_not_found"

settings:
  encodeUrl: true
