info:
  name: login
  type: http
  seq: 3

http:
  method: POST
  url: https://localhost:5001/login
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "securepassword"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
